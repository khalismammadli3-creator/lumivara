<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumivara Travel — Tezliklə</title>
  <link rel="icon" href="D_Icon.png" type="image/png">
  <style>
    @font-face {
      font-family: 'Host Grotesk';
      src: url('HostGrotesk-Light.ttf') format('truetype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Host Grotesk';
      src: url('HostGrotesk-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Host Grotesk';
      src: url('HostGrotesk-Medium.ttf') format('truetype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Host Grotesk';
      src: url('HostGrotesk-SemiBold.ttf') format('truetype');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Host Grotesk';
      src: url('HostGrotesk-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:  #1a5c50;
      --accent:   #00C9A7;
      --light:    #E8F5F2;
      --dark:     #061F1A;
      --muted:    #4A7B72;
    }

    html, body {
      height: 100%;
      font-family: 'Host Grotesk', sans-serif;
      background-color: var(--primary);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── BACKGROUND TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(0,201,167,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 10% 80%, rgba(0,201,167,0.07) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── LAYOUT ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    /* ── LOGO ── */
    .logo {
      margin-bottom: 3rem;
    }
    .logo img {
      height: 80px;
      width: auto;
    }

    /* ── BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,201,167,0.12);
      border: 1px solid rgba(0,201,167,0.35);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      margin-bottom: 2rem;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.75); }
    }

    /* ── HEADLINE ── */
    h1 {
      font-size: clamp(2.6rem, 7vw, 5rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    h1 span {
      color: var(--accent);
    }

    /* ── SUBTEXT ── */
    .sub {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      max-width: 520px;
      line-height: 1.75;
      margin-bottom: 3rem;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 56px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 auto 3rem;
      opacity: 0.7;
    }

    /* ── EMAIL LINK ── */
    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(0,201,167,0.12);
      border: 1px solid rgba(0,201,167,0.35);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 500;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 1rem;
    }
    .email-link:hover {
      background: var(--accent);
      color: var(--primary);
    }

    /* ── CONTACT ROW ── */
    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      justify-content: center;
      margin-top: 3.5rem;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-item:hover { color: var(--accent); }
    .contact-item svg { color: var(--accent); flex-shrink: 0; }

    /* ── FOOTER ── */
    .foot {
      position: absolute;
      bottom: 1.75rem;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      .form-row { flex-direction: column; }
      .form-row button { border-radius: 999px; }
    }
  </style>
</head>
<body>
